name: Weekly Code Audit

on:
  schedule:
    - cron: '0 9 * * 1' # каждый понедельник в 9:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect weekly changes
        id: weekly
        run: |
          OLDEST=$(git log --since="1 week ago" --format="%H" | tail -1)
          DELIM_COMMITS=$(openssl rand -hex 8)
          DELIM_FILES=$(openssl rand -hex 8)

          {
            echo "commits<<${DELIM_COMMITS}"
            git log --since="1 week ago" --no-merges --format="- %s (%an, %ar)" || echo "Коммитов за неделю нет"
            echo "${DELIM_COMMITS}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "files<<${DELIM_FILES}"
            if [ -n "$OLDEST" ]; then
              git diff --stat "${OLDEST}^..HEAD" 2>/dev/null || echo "Нет данных"
            else
              echo "Изменений за неделю нет"
            fi
            echo "${DELIM_FILES}"
          } >> "$GITHUB_OUTPUT"

          echo "week=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse audit
        id: lighthouse
        continue-on-error: true
        run: |
          npx --yes lighthouse@12 \
            https://ai-for-developers-production.up.railway.app/ \
            --preset=desktop \
            --output=json \
            --output=html \
            --output-path=./lighthouse \
            --chrome-flags="--headless"

          SCORES=$(jq -r '
            "Performance:    \(.categories.performance.score * 100 | round)/100",
            "Accessibility:  \(.categories.accessibility.score * 100 | round)/100",
            "Best Practices: \(.categories["best-practices"].score * 100 | round)/100",
            "SEO:            \(.categories.seo.score * 100 | round)/100",
            "",
            "LCP:            \(.audits["largest-contentful-paint"].displayValue)",
            "TBT:            \(.audits["total-blocking-time"].displayValue)",
            "CLS:            \(.audits["cumulative-layout-shift"].displayValue)",
            "FCP:            \(.audits["first-contentful-paint"].displayValue)",
            "Speed Index:    \(.audits["speed-index"].displayValue)"
          ' ./lighthouse.report.json 2>/dev/null || echo "Данные Lighthouse недоступны")

          DELIM=$(openssl rand -hex 8)
          {
            echo "scores<<${DELIM}"
            echo "$SCORES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Lighthouse report
        if: steps.lighthouse.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ steps.weekly.outputs.week }}
          path: lighthouse.report.html
          retention-days: 30

      - name: Run OpenCode weekly audit
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          prompt: |
            Ты — ревьюер кода. Проведи еженедельный аудит репозитория «Book a Call» —
            сервиса бронирования временных слотов (Fastify + SQLite + React).

            ## Коммиты за неделю
            ${{ steps.weekly.outputs.commits }}

            ## Изменённые файлы
            ${{ steps.weekly.outputs.files }}

            ## Lighthouse аудит (production)
            ${{ steps.lighthouse.outputs.scores }}

            ## Что нужно сделать
            1. Открой и изучи изменённые файлы из репозитория.
            2. Найди потенциальные проблемы: баги, нарушения паттернов, дублирование,
               небезопасный код, отсутствие обработки ошибок.
            3. Создай GitHub Issue с заголовком:
               "📋 Еженедельный аудит кода — ${{ steps.weekly.outputs.week }}"

               Issue должен содержать:
               ### Резюме недели
               Краткое описание сделанного.

               ### Lighthouse
               Таблица со скорами и Core Web Vitals. Отметь метрики ниже 90 как проблемные.

               ### Найденные проблемы в коде
               Таблица: Приоритет | Файл | Описание проблемы
               (приоритеты: 🔴 высокий / 🟡 средний / 🟢 низкий)

               ### Рекомендации
               Конкретные шаги по улучшению с указанием файлов и строк.
